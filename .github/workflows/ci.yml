name: CI

on:
  push:
    branches:
      - main
      - "codex/**"
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      ENVIRONMENT: test
      VISION_PROVIDER: mock
      CHAT_PROVIDER: off
      DEMO_MODE: "true"
      MANUAL_SEARCH_ENABLED: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Run backend tests
        run: python -m pytest -q

  frontend:
    name: Frontend production build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Type-check and build
        run: npm run build

  compose:
    name: Docker image build and runtime smoke test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate Compose configuration
        run: docker compose config --quiet
      - name: Build production images
        run: docker compose build
      - name: Run containers and verify same-origin API proxy and persistent session recovery
        run: |
          set -euxo pipefail
          docker compose up -d

          cleanup() {
            exit_code=$?
            trap - EXIT
            if [ "$exit_code" -ne 0 ]; then
              echo "Container smoke test failed; dumping service state before cleanup."
              docker compose ps || true
              docker compose logs backend web || true
            fi
            docker rm -f masbar-railway-volume-smoke >/dev/null 2>&1 || true
            docker volume rm masbar-railway-volume-smoke >/dev/null 2>&1 || true
            docker compose down --volumes || true
            exit "$exit_code"
          }
          trap cleanup EXIT

          wait_for_backend() {
            for attempt in $(seq 1 45); do
              if curl --fail --silent http://127.0.0.1:8010/health >/dev/null; then
                return 0
              fi
              sleep 2
            done
            docker compose logs backend
            return 1
          }

          wait_for_backend
          curl --fail --silent http://127.0.0.1:8080/ >/dev/null
          echo 'Frontend is reachable.'

          curl --fail --silent --show-error http://127.0.0.1:8080/health \
            -o /tmp/frontend-proxied-health.json
          curl --fail --silent --show-error http://127.0.0.1:8080/api/v1/equipment \
            -o /tmp/frontend-proxied-equipment.json
          python - <<'PY'
          import json
          from pathlib import Path

          health = json.loads(Path("/tmp/frontend-proxied-health.json").read_text())
          equipment = json.loads(Path("/tmp/frontend-proxied-equipment.json").read_text())
          assert health["status"] == "online"
          assert isinstance(equipment, list) and equipment
          PY
          echo 'Same-origin health and equipment API proxy are reachable.'

          backend_uid="$(docker compose exec -T backend id -u | tr -d '\r')"
          echo "Backend UID: $backend_uid"
          test "$backend_uid" = "10001"

          readonly_root="$(docker inspect "$(docker compose ps -q backend)" --format '{{.HostConfig.ReadonlyRootfs}}')"
          echo "Backend read-only root filesystem: $readonly_root"
          test "$readonly_root" = "true"

          session_response="$(docker compose exec -T backend python - <<'PY'
          import json
          from app.deps import get_assistant
          from app.domain.api_models import SessionCreateRequest

          session = get_assistant().create_session(
              SessionCreateRequest(equipment_model="Caterpillar C15 ACERT")
          )
          print(json.dumps(session.model_dump()))
          PY
          )"
          session_id="$(python -c 'import json,sys; print(json.load(sys.stdin)["session_id"])' <<< "$session_response")"

          echo "Created session through frontend origin: $session_id"
          docker compose restart backend
          wait_for_backend
          echo 'Backend restarted; checking restored session through frontend proxy.'

          curl --fail --silent --show-error \
            "http://127.0.0.1:8080/api/v1/sessions/$session_id" \
            -o /tmp/restored-session.json
          curl --fail --silent --show-error \
            "http://127.0.0.1:8080/api/v1/sessions/$session_id/audit" \
            -o /tmp/restored-audit.json

          SESSION_ID="$session_id" python - <<'PY'
          import json
          import os
          from pathlib import Path

          session = json.loads(Path("/tmp/restored-session.json").read_text())
          audit = json.loads(Path("/tmp/restored-audit.json").read_text())
          assert session["session_id"] == os.environ["SESSION_ID"]
          assert audit["session_id"] == os.environ["SESSION_ID"]
          assert any(item["event"] == "session_created" for item in audit["entries"])
          PY

          echo 'Simulating Railway volume ownership and privilege drop.'
          docker volume create masbar-railway-volume-smoke
          docker run -d --name masbar-railway-volume-smoke \
            --user 0 \
            -p 8011:8000 \
            -e PORT=8000 \
            -e SESSION_DB_PATH=/app/data/sessions/sessions.sqlite3 \
            -v masbar-railway-volume-smoke:/app/data/sessions \
            industrial-spatial-ai-backend:0.1.0

          for attempt in $(seq 1 45); do
            if curl --fail --silent http://127.0.0.1:8011/health >/dev/null; then
              break
            fi
            sleep 2
          done
          curl --fail --silent --show-error http://127.0.0.1:8011/health >/dev/null

          runtime_uid="$(docker exec masbar-railway-volume-smoke sh -c "awk '/^Uid:/{print \$2}' /proc/1/status")"
          volume_owner="$(docker exec masbar-railway-volume-smoke stat -c '%u:%g' /app/data/sessions)"
          test "$runtime_uid" = "10001"
          test "$volume_owner" = "10001:10001"

          docker exec masbar-railway-volume-smoke python - <<'PY'
          from app.deps import get_assistant
          from app.domain.api_models import SessionCreateRequest

          get_assistant().create_session(
              SessionCreateRequest(equipment_model="Caterpillar C15 ACERT")
          )
          PY

          db_owner="$(docker exec masbar-railway-volume-smoke stat -c '%u:%g' /app/data/sessions/sessions.sqlite3)"
          test "$db_owner" = "10001:10001"
          echo 'Railway-style root-owned volume is writable while FastAPI runs as UID 10001.'
