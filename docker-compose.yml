services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: industrial-spatial-ai-backend:0.1.0
    container_name: isa-backend
    ports:
      - "8010:8000"
    env_file:
      - path: .env
        required: false
    environment:
      ENVIRONMENT: production
      PORT: "8000"
      CORS_ORIGINS: "${CORS_ORIGINS:-http://localhost:8080}"
      MANUAL_SEARCH_ENABLED: "false"
      SESSION_DB_PATH: /app/data/sessions/sessions.sqlite3
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    volumes:
      - ./data/manual_index:/app/data/manual_index:ro
      - misbar_sessions:/app/data/sessions
      - misbar_tts_cache:/app/data/cache/tts
    restart: unless-stopped

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ""
    image: industrial-spatial-ai-web:0.1.0
    container_name: isa-web
    ports:
      - "8080:80"
    environment:
      PORT: "80"
      BACKEND_UPSTREAM: "http://backend:8000"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  misbar_sessions:
  misbar_tts_cache:
