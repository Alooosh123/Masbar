[project]
name = "industrial-spatial-ai-backend"
version = "0.1.0"
description = "Deterministic safety-first backend for the Industrial Spatial AI Assistant"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "httpx>=0.27",
    "pypdf>=7.1.1,<8.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["ignore"]

[tool.ruff]
line-length = 100
target-version = "py312"
